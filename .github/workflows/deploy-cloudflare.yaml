name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js 22 and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Patch config
        run: |
          jq '.site.environment = "${{ vars.ENVIRONMENT }}" | 
          .site.base_url = "${{ vars.BASE_URL }}" | 
          .site.base_path = "${{ vars.BASE_PATH }}" | 
          .sentry.dsn = "${{ secrets.SENTRY_DSN }}" | 
          .sentry.project = "${{ vars.SENTRY_PROJECT }}" | 
          .sentry.org = "${{ vars.SENTRY_ORG }}" | 
          .sentry.traces_sample_rate = ${{ vars.SENTRY_TRACES_SAMPLE_RATE }} | 
          .sentry.replays_session_sample_rate = ${{ vars.SENTRY_REPLAYS_SESSION_SAMPLE_RATE }} | 
          .sentry.profiles_sample_rate = ${{ vars.SENTRY_PROFILES_SAMPLE_RATE }} |
          .sentry.feedback_integration = ${{ vars.SENTRY_FEEDBACK_INTEGRATION }}
          ' src/config/config.json > temp.json && \
          mv temp.json src/config/config.json && \
          cat src/config/config.json
      - name: Yarn install
        run: yarn install --immutable
      - name: Build site
        run: yarn build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.131.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --config dist/client/wrangler.json
            --name "${{ vars.CLOUDFLARE_WORKER_NAME }}"
            --domain "${{ vars.CLOUDFLARE_WORKER_DOMAIN }}"
